name: Recorder v2 checks
on:
  push:
    branches: [version-2]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recorder-v2-test-evidence
          path: |
            test-results/browser/
            outputs/*.zip
          if-no-files-found: ignore
          retention-days: 14
